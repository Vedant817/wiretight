[project]
name = "wiretight"
version = "1.0.0"
description = "Supplier payouts that can't be quietly redirected. New or changed bank details stay locked until a second person confirms them by callback."
requires-python = "==3.12.*"
license = { text = "Apache-2.0" }
authors = [{ name = "Wiretight" }]
readme = "README.md"

# Pinned per FINAL.md §6.1 (recorded by the board 8 Oct 2026). Exact pins only.
# If a pin does not resolve, take the nearest released version and record old -> new
# and why in docs/DECISIONS.md. Never fall back to an unpinned range (R4 S-5).
dependencies = [
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "httpx==0.28.1",
    "sqlalchemy==2.1.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
    "rfc8785==0.1.4",
    "webauthn==3.0.1",
    "cryptography==50.0.2",
    # Week 2 optional ingest (cut item 3). No OCR.
    "pdfplumber==0.11.10",
    "pypdf==6.19.0",
    # Week 2 optional LLM, behind LLMProvider, off by default, never in the money path.
    "anthropic==1.12.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "hypothesis==6.168.5",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "time-machine==3.5.1",
    "ruff==0.16.10",
    # Timezone data for zoneinfo. Without it ZoneInfo("Asia/Kolkata") raises on
    # Windows and in slim containers, and the IST daily caps crash on day one.
    "tzdata==2026.2",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20250915",
    # Generates the committed calendar YAML. NOT imported at runtime.
    "holidays==0.106",
]

[project.scripts]
wiretight = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# FINAL.md §4.0 — the wording lint's banned list is written out here and nowhere
# else. tests/unit/test_wording.py enforces it across app/, scripts/, README.md,
# docs/ (except docs/spec/) and templates.
# ---------------------------------------------------------------------------
[tool.wiretight]
banned_wording = [
    "\\bcounter-?sign\\w*",
    "\\bwire[sd]?\\b",
    "\\bwire[ -]transfer",
    "\\bwire tight\\b",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--timeout=120",
]
markers = [
    "live: needs real Airwallex sandbox credentials. Never runs in CI's offline job.",
    "compliance: carries a FINAL.md §10.3 test id, e.g. @pytest.mark.compliance(\"T-04\").",
    "contract: client vs recorded fixtures.",
    "acceptance: safety and acceptance tests.",
    "property: Hypothesis properties.",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["app"]
# Coverage is reported, never presented as quality (FINAL.md §10.1 rule 12).
omit = ["app/ingest/integrations_unused.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["docs/spec", "var", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "RUF"]
ignore = [
    # Decimal money is deliberately explicit; string ids and hashes are not secrets.
    "S101",
]

[tool.ruff.lint.per-file-ignores]
# Tests may assert, use bare asserts, and shadow names on purpose.
"tests/**" = ["ARG001", "ARG002", "S101", "PLR2004", "N806"]
"scripts/**" = ["S603", "S607"]
# The demo page is one embedded HTML document: template lines are not code.
"app/demo/page.py" = ["E501", "RUF001"]
# The soft authenticator exists only in tests/support and is import-guarded (T-R4a).

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_return_any = true
exclude = ["^docs/", "^var/", "^dist/"]

# FINAL.md §6.1: mypy --strict on the money-path modules only.
[[tool.mypy.overrides]]
module = ["app.core.*", "app.integrations.*"]
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_incomplete_defs = true
check_untyped_defs = true
extra_checks = true